# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock config - Info-Packed Sidebar
                                                         
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    cursor_size = 24
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/hit235/Pictures/wallpapers/red-sun-cloud.jpg
    color = rgb(0,0,0)
    blur_size = 0
    blur_passes = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# --- TOP CENTER: TIME & DATE ---
# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='5000'>$(date +"%I:%M %p")</span>"
    color = rgb(255, 255, 255)
    font_size = 135
    font_family = Inter Bold
    position = 25, -50
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.2
}

# Day and Date (Just below Time)
label {
    monitor =
    text = cmd[update:18000000] echo "<span letter_spacing='2000'><b> "$(date +'%A, %-d %B')" </b></span>"
    color = rgb(255, 255, 255)
    font_size = 30
    font_family = Inter
    position = 25, -240
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.2
}

# --- CENTER: PASSWORD INPUT ---
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.45)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(255, 255, 255)
    dots_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Inter
    placeholder_text = <span foreground="##ffffffcc" letter_spacing="1000">Enter Password...</span>
    hide_input = false
    position = 40, 0
    halign = center
    valign = center
    check_color = $color10
    fail_color = $color9
}

# --- LEFT SIDE: COMPREHENSIVE STATUS ---
label {
    monitor =
    text = cmd[update:1000] echo -e "󰁹 $($Scripts/Battery.sh)\n󱑎 $(uptime -p | sed 's/up //')\n󰻠 $(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1"%"}')\n󰍛 $(free -h | awk '/^Mem:/ {print $3 "/" $2}')\n󰋊 $(df -h / | awk 'NR==2 {print $3 "/" $2}')"
    color = rgb(200, 200, 200)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 80, 80
    halign = left
    valign = bottom
    text_align = left
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.2
}

# --- RIGHT SIDE: WEATHER & OTHER ---
label {
    monitor =
    text = cmd[update:3600000] echo "$(cat /home/hit235/.cache/.weather_cache | sed 's/  */ /g')"
    color = rgb(200, 200, 200)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = -80, 80
    halign = right
    valign = bottom
    text_align = right
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.2
}

# Layout info removed as per request
