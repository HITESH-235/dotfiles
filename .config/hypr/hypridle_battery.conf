# /* ---- 💫 Dynamic Battery optimized Hypridle config 💫 ---- */

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
    ignore_dbus_inhibit = true
    inhibit_sleep = 3
}

# 1. Dim screen (60 seconds)
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. Lock screen and turn off display (120 seconds)
listener {
    timeout = 120
    on-timeout = loginctl lock-session && (sleep 1 && hyprctl dispatch dpms off)
    on-resume = hyprctl dispatch dpms on
}

# 3. Suspend system (300 seconds)
listener {
    timeout = 300
    on-timeout = systemctl suspend
    ignore_inhibit = true
}
